# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: supportiq_user
      POSTGRES_PASSWORD: supportiq_password
      POSTGRES_DB: supportiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportiq_user -d supportiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # This overrides the default SQLite URL in database.py
      - DATABASE_URL=postgresql://supportiq_user:supportiq_password@db:5432/supportiq_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: